<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JeeMoNa Supermarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rubik', sans-serif;
      background: #f7f9fc;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: linear-gradient(120deg, #43e97b, #38f9d7);
      color: white;
      padding: 60px 20px;
      text-align: center;
      border-radius: 0 0 40px 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    header p { font-size: 1.1rem; }

    nav {
      background-color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .links {
      display: flex;
      gap: 25px;
    }
    nav a {
      color: #28a745;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }
    nav a:hover { text-decoration: underline; }

    .search-bar {
      padding: 8px 16px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 1rem;
      width: 200px;
      transition: all 0.3s ease;
    }

    .cart-btn, .account-btn {
      background: #28a745;
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      position: relative;
      margin-left: 10px;
    }
    .cart-count {
      background: #fff;
      color: #28a745;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 0.75rem;
      position: absolute;
      top: -8px;
      right: -8px;
      font-weight: bold;
      border: 2px solid #218838;
    }

    .section {
      padding: 60px 20px;
      text-align: center;
    }
    .section h2 {
      font-size: 2rem;
      margin-bottom: 40px;
      color: #28a745;
    }

    .category-filter {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .category-filter button {
      background: #e0f4ea;
      color: #28a745;
      padding: 6px 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .category-filter button.active {
      background: #28a745;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    .product-card h3 { font-size: 1.2rem; margin-bottom: 5px; }
    .product-card p {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .product-card button {
      padding: 8px 16px;
      background: linear-gradient(120deg, #43e97b, #38f9d7);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .product-card button:active { transform: scale(1.05); }

    footer {
      background: #222;
      color: #ccc;
      padding: 30px;
      text-align: center;
      margin-top: 60px;
      border-radius: 30px 30px 0 0;
    }

    .cart {
      position: fixed;
      top: 0;
      right: -100%;
      width: 340px;
      height: 100%;
      background: white;
      box-shadow: -3px 0 20px rgba(0,0,0,0.2);
      padding: 25px;
      transition: right 0.4s ease;
      z-index: 1000;
    }
    .cart.open { right: 0; }
    .cart h3 {
      margin-bottom: 20px;
      font-size: 1.4rem;
      color: #28a745;
    }
    .cart-items {
      max-height: 60vh;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }
    .item-info {
      flex: 1;
      text-align: left;
    }
    .qty-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .qty-controls button {
      background: #28a745;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-total {
      font-weight: bold;
      font-size: 1.1rem;
      text-align: right;
    }

    /* Login Modal */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
    }
    .modal-content h3 {
      margin-bottom: 20px;
      color: #28a745;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    .modal-content button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
    }
    .modal .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .back-btn {
      background: #28a745;
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      margin-top: 10px;
      cursor: pointer;
    }

    .contact-info {
      background: #f4f7fa;
      padding: 40px 20px;
      text-align: center;
    }
    .contact-info h3 {
      color: #28a745;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
    .contact-info p {
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>JeeMoNa Supermarket</h1>
    <p>Fresh • Local • Affordable</p>
  </header>

  <nav>
    <div class="links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contack">Contact</a>
    </div>
    <div>
      <input class="search-bar" id="search-bar" type="text" placeholder="Search..." oninput="searchProducts()" />
      <button class="cart-btn" onclick="toggleCart()">Cart <span class="cart-count" id="cart-count">0</span></button>
      <button class="account-btn" onclick="toggleLogin()">Login</button>
    </div>
  </nav>

  <section class="section">
    <h2>Our Products</h2>
    <div class="category-filter">
      <button onclick="filterCategory('Fruits')">Fruits</button>
      <button onclick="filterCategory('Vegetables')">Vegetables</button>
      <button onclick="filterCategory('Bakery')">Bakery</button>
      <button onclick="filterCategory('Dairy')">Dairy</button>
      <button onclick="filterCategory('Meat')">Meat</button>
    </div>

    <div class="products" id="product-list"></div>
  </section>

  <section id="contact">
  <section class="contact-info">
    <h3>Contact Us</h3>
    <p>For inquiries or more information, reach us at:</p>
    <p>Email: jeemona@greenmart.com</p>
    <p>Phone: +91-8688522371</p>
  </section></section>

  <footer>
    <p>&copy; 2025 GreenMart Supermarket | All rights reserved</p>
  </footer>

  <div class="cart" id="cart">
    <button class="close-btn" onclick="toggleCart()">×</button>
    <h3>Your Cart</h3>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-total" id="cart-total">₹0.00</div>
    <button onclick="proceedToPayment()">Proceed to Payment</button>
  </div>

  <div class="modal" id="login-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleLogin()">×</button>
      <h3>Login</h3>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <button class="back-btn" onclick="toggleLogin()">Back</button>
    </div>
  </div>


  <script>
    let cart = [];
    let products = [
      { name: "Apple", category: "Fruits", price: 175, img: "apple.png", qty: 1 },
      { name: "Guava", category: "Fruits", price: 72, img: "guava.png", qty: 1 },
      { name: "Mangos", category: "Fruits", price: 179, img: "mango.jpg", qty: 1 },
      { name: "Banana", category: "Fruits", price: 60, img: "banana.png", qty: 1 },
      { name: "Tomato", category: "Vegetables", price: 25, img: "tomato.jpg", qty: 1 },
      { name: "Carrot", category: "Vegetables", price: 60, img: "carrot.jpg", qty: 1 },
      { name: "Onion", category: "Vegetables", price: 32, img: "onion.jpg", qty: 1 },
      { name: "Potato", category: "Vegetables", price: 30, img: "potatao.png", qty: 1 },
      { name: "Milk", category: "Dairy", price: 35, img: "milk.png", qty: 1 },
      { name: "Eggs", category: "Dairy", price: 116, img: "eggs.jpg", qty: 1 },
      { name: "Curd", category: "Dairy", price: 30, img: "curd.jpg", qty: 1 },
      { name: "Panner", category: "Dairy", price: 100, img: "paneer.webp", qty: 1 },
      { name: "Cake", category: "Bakery", price: 83, img: "cake.jpg", qty: 1 },
      { name: "Cookies", category: "Bakery", price: 38, img: "cookies.png", qty: 1 },
      { name: "Bread", category: "Bakery", price: 60, img: "bread.jpg", qty: 1 },
      { name: "Puff", category: "Bakery", price: 20, img: "puff.jpg", qty: 1 },
      { name: "Chicken", category: "Meat", price: 220, img: "chicken.webp", qty: 1 },
      { name: "fish", category: "Meat", price: 180, img: "fish.jpg", qty: 1 },
      { name: "Prawns", category: "Meat", price: 200, img: "prawns.jpg", qty: 1 },

    ];

    function filterCategory(category) {
      let filteredProducts = products.filter(p => p.category === category);
      renderProducts(filteredProducts);
    }

    function renderProducts(productsToRender) {
      const productList = document.getElementById("product-list");
      productList.innerHTML = '';
      productsToRender.forEach(product => {
        let productCard = `
          <div class="product-card">
            <img src="${product.img}" alt="${product.name}" />
            <h3>${product.name}</h3>
            <p>₹${product.price}</p>
            <button onclick="addToCart('${product.name}')">Add to Cart</button>
            <div id="quantity-control-${product.name}" class="qty-controls" style="display:none;">
              <button onclick="updateQuantity('${product.name}', -1)">-</button>
              <span id="qty-${product.name}">${product.qty}</span>
              <button onclick="updateQuantity('${product.name}', 1)">+</button>
            </div>
          </div>
        `;
        productList.innerHTML += productCard;
      });
    }

    function addToCart(productName) {
      const product = products.find(p => p.name === productName);
      cart.push(product);
      document.getElementById("cart-count").innerText = cart.length;
      showQuantityControl(productName);
    }

    function showQuantityControl(productName) {
      document.getElementById(`quantity-control-${productName}`).style.display = 'flex';
    }

    function updateQuantity(productName, delta) {
      let product = cart.find(p => p.name === productName);
      if (product) {
        product.qty += delta;
        document.getElementById(`qty-${productName}`).innerText = product.qty;
      }
    }

    function toggleCart() {
      const cartPanel = document.getElementById("cart");
      cartPanel.classList.toggle("open");
      renderCartItems();
    }

    function renderCartItems() {
      const cartItemsDiv = document.getElementById("cart-items");
      cartItemsDiv.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        let cartItem = `
          <div class="cart-item">
            <div class="item-info">
              <h4>${item.name}</h4>
              <p>₹${item.price} × ${item.qty}</p>
            </div>
            <div class="qty-controls">
              <button onclick="updateQuantity('${item.name}', -1)">-</button>
              <span>${item.qty}</span>
              <button onclick="updateQuantity('${item.name}', 1)">+</button>
            </div>
          </div>
        `;
        cartItemsDiv.innerHTML += cartItem;
      });
      document.getElementById("cart-total").innerText = `₹${total}`;
    }

    function proceedToPayment() {
      alert("Proceeding to payment...");
    }

    function toggleLogin() {
      const modal = document.getElementById("login-modal");
      modal.classList.toggle("active");
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (email && password) {
        alert("Logged in successfully!");
        toggleLogin();
      } else {
        alert("Please enter email and password.");
      }
    }

    renderProducts(products);
  </script>
</body>
</html>
